<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@azzimi_ — Instagram Fallback & Unfollowers Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #F8FAFC;
      --bg-card: #FFFFFF;
      --border-subtle: #E2E8F0;
      --border-hover: #CBD5E1;
      --text-main: #0F172A;
      --text-muted: #64748B;
      --text-light: #94A3B8;
      --accent-primary: #0F172A;
      --accent-red: #E11D48;
      --accent-red-bg: #FFE4E6;
      --accent-green: #059669;
      --accent-green-bg: #D1FAE5;
      --accent-blue: #2563EB;
      --accent-blue-bg: #DBEAFE;
      --accent-amber: #D97706;
      --accent-amber-bg: #FEF3C7;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      min-height: 100vh;
      line-height: 1.5;
      padding: 24px 16px 80px;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      background-color: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      box-shadow: var(--shadow-sm);
    }

    .brand-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: var(--accent-green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .sync-time {
      font-size: 12px;
      color: var(--text-muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* Profile Header Card */
    .profile-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 20px;
    }

    .profile-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .profile-avatar {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--border-subtle);
      background: #F1F5F9;
    }

    .profile-info h1 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .profile-info p {
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .profile-right {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .btn-action {
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .btn-dark {
      background: var(--accent-primary);
      color: #FFFFFF;
      border: 1px solid var(--accent-primary);
    }
    .btn-dark:hover {
      opacity: 0.9;
    }

    .btn-light {
      background: #FFFFFF;
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
    }
    .btn-light:hover {
      background: #F1F5F9;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 16px 20px;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: all 0.2s;
    }

    .stat-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .stat-card.active-filter {
      border-color: var(--accent-primary);
      background: #FAFAFC;
    }

    .stat-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-value {
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
      font-family: 'JetBrains Mono', monospace;
    }

    .stat-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    /* Toolbar */
    .results-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 16px;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .tab-pill {
      padding: 6px 14px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      border: 1px solid var(--border-subtle);
      background: #FFFFFF;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-pill:hover {
      background: #F8FAFC;
    }

    .tab-pill.active {
      background: var(--text-main);
      color: #FFFFFF;
      border-color: var(--text-main);
    }

    .tab-pill .count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 9999px;
      background: rgba(0,0,0,0.06);
    }

    .tab-pill.active .count {
      background: rgba(255,255,255,0.25);
    }

    .search-input-wrap {
      position: relative;
      min-width: 240px;
    }

    .search-input {
      width: 100%;
      padding: 8px 12px 8px 34px;
      font-size: 13px;
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--text-main);
      outline: none;
    }

    .search-input:focus {
      border-color: var(--text-main);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-light);
      font-size: 13px;
    }

    /* Grid of Users */
    .users-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }

    .user-card {
      background: #FFFFFF;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      transition: border 0.15s, transform 0.1s;
    }

    .user-card:hover {
      border-color: var(--border-hover);
      transform: translateY(-1px);
    }

    .user-left {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      background: #E2E8F0;
      flex-shrink: 0;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .username {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .username:hover {
      text-decoration: underline;
    }

    .user-fullname {
      font-size: 11px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .badge-tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      width: fit-content;
      margin-top: 3px;
    }

    .badge-tag.unfollowers {
      background: var(--accent-red-bg);
      color: var(--accent-red);
    }

    .badge-tag.mutual {
      background: var(--accent-green-bg);
      color: var(--accent-green);
    }

    .badge-tag.fans {
      background: var(--accent-amber-bg);
      color: var(--accent-amber);
    }

    .user-actions {
      display: flex;
      gap: 6px;
    }

    .icon-btn {
      width: 28px;
      height: 28px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-subtle);
      background: #FFFFFF;
      color: var(--text-muted);
      cursor: pointer;
      text-decoration: none;
      font-size: 12px;
      transition: all 0.15s;
    }

    .icon-btn:hover {
      background: #F1F5F9;
      color: var(--text-main);
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 16px;
      color: var(--text-muted);
      font-size: 14px;
      grid-column: 1 / -1;
      background: #FFFFFF;
      border-radius: var(--radius);
      border: 1px dashed var(--border-subtle);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--text-main);
      color: #FFFFFF;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      box-shadow: var(--shadow-md);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Top Bar -->
  <div class="top-bar">
    <div class="brand-badge">
      <span class="brand-dot"></span>
      Dorizz Live Radar • Instagram
    </div>
    <div class="sync-time" id="sync-time">Memuat data terbaru...</div>
  </div>

  <!-- Profile Card -->
  <div class="profile-card">
    <div class="profile-left">
      <img src="https://instagram.fvns1-2.fna.fbcdn.net/v/t51.2885-19/573323465_1219825463302212_7278921664109726296_n.png" id="profile-pic" class="profile-avatar" alt="Avatar" />
      <div class="profile-info">
        <h1>
          <span id="profile-fullname">Rido Azimi</span>
          <span style="font-size: 13px; font-weight: 500; color: var(--text-muted);" id="profile-username">(@azzimi_)</span>
        </h1>
        <p>Dashboard pemantauan akun yang tidak follow back (fallback) Instagram.</p>
      </div>
    </div>
    <div class="profile-right">
      <a href="https://instagram.com/azzimi_" target="_blank" class="btn-action btn-light">
        ↗ Profil IG
      </a>
      <button class="btn-action btn-dark" onclick="copyCurrentList()">
        📋 Salin List
      </button>
      <button class="btn-action btn-light" onclick="exportCSV()">
        📥 Export CSV
      </button>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="stats-grid">
    <div class="stat-card active-filter" id="card-not_following_back" onclick="setFilter('not_following_back')">
      <div class="stat-label">
        <span>Gak Follback Kamu</span>
        <span class="stat-indicator" style="background: var(--accent-red);"></span>
      </div>
      <div class="stat-value" id="count-unfollowers" style="color: var(--accent-red);">342</div>
    </div>

    <div class="stat-card" id="card-mutual" onclick="setFilter('mutual')">
      <div class="stat-label">
        <span>Saling Follow (Mutual)</span>
        <span class="stat-indicator" style="background: var(--accent-green);"></span>
      </div>
      <div class="stat-value" id="count-mutual" style="color: var(--accent-green);">727</div>
    </div>

    <div class="stat-card" id="card-following" onclick="setFilter('all_following')">
      <div class="stat-label">
        <span>Total Following</span>
        <span class="stat-indicator" style="background: var(--accent-blue);"></span>
      </div>
      <div class="stat-value" id="count-following">1,069</div>
    </div>

    <div class="stat-card" id="card-fans" onclick="setFilter('fans')">
      <div class="stat-label">
        <span>Total Followers</span>
        <span class="stat-indicator" style="background: var(--accent-amber);"></span>
      </div>
      <div class="stat-value" id="count-followers">9,284</div>
    </div>
  </div>

  <!-- Toolbar -->
  <div class="results-toolbar">
    <div class="filter-tabs">
      <button class="tab-pill active" id="tab-not_following_back" onclick="setFilter('not_following_back')">
        🚫 Gak Follback <span class="count" id="pill-count-unfollowers">342</span>
      </button>
      <button class="tab-pill" id="tab-mutual" onclick="setFilter('mutual')">
        🤝 Mutual <span class="count" id="pill-count-mutual">727</span>
      </button>
      <button class="tab-pill" id="tab-all_following" onclick="setFilter('all_following')">
        📋 Semua Following <span class="count" id="pill-count-following">1,069</span>
      </button>
      <button class="tab-pill" id="tab-fans" onclick="setFilter('fans')">
        ⭐ Fans Teratas <span class="count" id="pill-count-fans">500</span>
      </button>
    </div>

    <div class="search-input-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" class="search-input" id="search-box" placeholder="Cari nama atau @username..." oninput="handleSearch()" />
    </div>
  </div>

  <!-- Users Grid -->
  <div class="users-grid" id="users-grid">
    <!-- Injected via JS -->
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast-msg">Teks berhasil disalin!</div>

<script>
  let rawData = null;
  let currentFilter = 'not_following_back';
  let filteredData = [];

  const defaultAvatar = "https://instagram.fvns1-2.fna.fbcdn.net/v/t51.2885-19/573323465_1219825463302212_7278921664109726296_n.png?stp=dst-jpg_tt6";

  async function loadData() {
    try {
      const resp = await fetch('data.json?t=' + Date.now());
      if (resp.ok) {
        rawData = await resp.json();
        renderHeader();
        setFilter(currentFilter);
      }
    } catch (e) {
      console.log('Error loading data.json:', e);
    }
  }

  function renderHeader() {
    if (!rawData || !rawData.profile) return;
    const p = rawData.profile;
    document.getElementById('profile-fullname').textContent = p.full_name || 'Rido Azimi';
    document.getElementById('profile-username').textContent = `(@${p.username})`;
    document.getElementById('sync-time').textContent = `Update: ${p.updated_at}`;

    document.getElementById('count-unfollowers').textContent = (p.total_not_following_back || 0).toLocaleString('id-ID');
    document.getElementById('count-mutual').textContent = (p.total_mutual || 0).toLocaleString('id-ID');
    document.getElementById('count-following').textContent = (p.total_following || 0).toLocaleString('id-ID');
    document.getElementById('count-followers').textContent = (p.total_followers || 0).toLocaleString('id-ID');

    document.getElementById('pill-count-unfollowers').textContent = p.total_not_following_back || 0;
    document.getElementById('pill-count-mutual').textContent = p.total_mutual || 0;
    document.getElementById('pill-count-following').textContent = p.total_following || 0;
    document.getElementById('pill-count-fans').textContent = (rawData.fans ? rawData.fans.length : 0);
  }

  function setFilter(type) {
    currentFilter = type;
    document.querySelectorAll('.tab-pill').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.stat-card').forEach(card => card.classList.remove('active-filter'));

    const tab = document.getElementById(`tab-${type}`);
    if (tab) tab.classList.add('active');

    const card = document.getElementById(`card-${type}`);
    if (card) card.classList.add('active-filter');

    if (!rawData) return;

    if (type === 'not_following_back') {
      filteredData = rawData.not_following_back || [];
    } else if (type === 'mutual') {
      filteredData = rawData.mutual || [];
    } else if (type === 'fans') {
      filteredData = rawData.fans || [];
    } else {
      filteredData = rawData.all_following || [];
    }

    handleSearch();
  }

  function handleSearch() {
    const q = document.getElementById('search-box').value.toLowerCase().trim();
    const finalData = q
      ? filteredData.filter(u => 
          (u.username && u.username.toLowerCase().includes(q)) || 
          (u.full_name && u.full_name.toLowerCase().includes(q))
        )
      : filteredData;
    renderGrid(finalData);
  }

  function renderGrid(users) {
    const grid = document.getElementById('users-grid');
    grid.innerHTML = '';

    if (!users || users.length === 0) {
      grid.innerHTML = `<div class="empty-state">Tidak ada akun yang cocok dengan filter atau pencarian.</div>`;
      return;
    }

    let badgeClass = 'unfollowers';
    let badgeText = 'Gak Follback';
    if (currentFilter === 'mutual') {
      badgeClass = 'mutual';
      badgeText = 'Mutual';
    } else if (currentFilter === 'fans') {
      badgeClass = 'fans';
      badgeText = 'Fans';
    } else if (currentFilter === 'all_following') {
      badgeClass = 'mutual';
      badgeText = 'Following';
    }

    users.forEach(u => {
      const card = document.createElement('div');
      card.className = 'user-card';
      const pic = u.profile_pic_url || defaultAvatar;
      const verified = u.is_verified ? '<span title="Verified" style="color: #0284C7; font-size: 11px;">✓</span>' : '';
      const fullName = u.full_name ? u.full_name : `@${u.username}`;

      card.innerHTML = `
        <div class="user-left">
          <img src="${pic}" class="user-avatar" onerror="this.src='${defaultAvatar}'" alt="${u.username}" />
          <div class="user-meta">
            <a href="https://instagram.com/${u.username}" target="_blank" rel="noopener noreferrer" class="username">
              @${u.username} ${verified}
            </a>
            <div class="user-fullname">${fullName}</div>
            <span class="badge-tag ${badgeClass}">${badgeText}</span>
          </div>
        </div>
        <div class="user-actions">
          <button class="icon-btn" title="Salin @username" onclick="copyUsername('${u.username}')">📋</button>
          <a href="https://instagram.com/${u.username}" target="_blank" rel="noopener noreferrer" class="icon-btn" title="Buka Profil IG">↗</a>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function copyUsername(u) {
    navigator.clipboard.writeText('@' + u);
    showToast(`@${u} disalin ke clipboard!`);
  }

  function copyCurrentList() {
    if (!filteredData || filteredData.length === 0) return;
    const text = filteredData.map(u => '@' + u.username).join('\n');
    navigator.clipboard.writeText(text);
    showToast(`${filteredData.length} username berhasil disalin!`);
  }

  function exportCSV() {
    if (!filteredData || filteredData.length === 0) return;
    const csvContent = "data:text/csv;charset=utf-8,Username,Nama,Status,Link Profil\n" + 
      filteredData.map(u => `"${u.username}","${(u.full_name || '').replace(/"/g, '""')}","${currentFilter}","https://instagram.com/${u.username}"`).join("\n");
    
    const encodedUri = encodeURI(csvContent);
    const link = document.createElement("a");
    link.setAttribute("href", encodedUri);
    link.setAttribute("download", `instagram_${currentFilter}_${Date.now()}.csv`);
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  function showToast(text) {
    const t = document.getElementById('toast-msg');
    t.textContent = text;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  loadData();
</script>

</body>
</html>
